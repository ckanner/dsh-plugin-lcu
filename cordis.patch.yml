# The dsh-plugin-lcu bundle patch.
#
# One row. The plugin owns every LCU connection and registers the model-facing
# computer-use tools per Agent; it starts nothing at load time, so a session pays
# for the CUA runtime only when its Agent preset is listed here.
#
# `presets` is an explicit allowlist rather than a capability the preset
# declares, because the server owns the tool schemas: they can only be fetched
# after the MCP handshake, which happens once a matching Agent is created.
#
# `chrome: true` enables LCU's browser surface (`lcu --chrome`). It also needs
# the official ChatGPT extension enabled in the Chrome profile and
# `lcu browser install`; sites stay exact-origin approvals.

- insert:
    - id: lcu
      name: 'dsh-plugin-lcu'
      config:
        presets:
          - heavy
        chrome: true
        # Approvals are a person's, and an unanswered question is a refusal, so an
        # unattended run needs both halves decided here. The diagnostic log names
        # every application and origin that was asked, which is how to find them.
        # allowedApps:
        #   - com.google.Chrome
        # allowedOrigins:
        #   - http://localhost:3000
